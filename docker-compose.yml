# Optional: local Postgres. Start with `docker compose up -d`,
# then set DATABASE_URL in backend/.env (see backend/.env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
